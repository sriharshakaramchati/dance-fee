<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Fee</title>
<style>
:root{--ac:#b4235f;--bg:#fff7fa;--tx:#2a2030}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:var(--ac);color:#fff;padding:24px 16px;text-align:center}header h1{margin:0;font-size:1.4rem}header p{margin:4px 0 0;opacity:.9}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.due{text-align:center}.amt{font-size:2.2rem;font-weight:700;color:var(--ac)}.small{font-size:.9rem;color:#6b6075}
.qr{display:block;margin:8px auto;width:220px;max-width:70%;height:auto}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1rem;text-align:center;text-decoration:none;margin-top:10px;cursor:pointer}
.btn.alt{background:#fff;color:var(--ac);border:2px solid var(--ac)}
dl{margin:0}dt{font-size:.8rem;color:#6b6075;margin-top:10px}dd{margin:0;font-weight:600;display:flex;justify-content:space-between;gap:8px;word-break:break-all}
dd button{border:1px solid #ddd;background:#f6f0f3;border-radius:6px;padding:2px 10px;cursor:pointer}
input{width:100%;padding:12px;margin-top:8px;border:1px solid #ccc;border-radius:8px;font-size:1rem}
h2{font-size:1.05rem;margin:0 0 6px}#msg{margin-top:8px;font-weight:600}
.kid{border:1px solid #eee;border-radius:10px;padding:12px;margin-top:10px}.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.8rem;font-weight:700}.b-N{background:#fde7ef;color:#b4235f}.b-C{background:#fff4d6;color:#8a6100}.b-Y{background:#dcf5e3;color:#1a7f37}
footer{text-align:center;padding:20px;font-size:.8rem;color:#8a7f90}
</style></head><body>
<header><h1 id="cls"></h1><p>Monthly fee payment</p></header>
<main>
<section class="card due"><div class="small">Fee for <span id="mon"></span></div><div class="amt" id="amt"></div><div id="due" class="small"></div></section>
<section class="card"><h2>Pay by UPI</h2>
<img id="qr" class="qr" alt="UPI QR code">
<div class="small" style="text-align:center">Scan with any UPI app (GPay, PhonePe, Paytm, BHIM)</div>
<a id="upiBtn" class="btn">Pay in UPI app (on phone)</a></section>
<section class="card"><h2>Bank transfer</h2><dl id="bank"></dl></section>
<section class="card"><h2>Paid already?</h2><div class="small">Send a quick note so it is marked received.</div><a id="waBtn" class="btn alt" target="_blank" rel="noopener">Tell teacher on WhatsApp</a></section>
<section class="card" id="acct" hidden><h2>My account</h2>
<div id="gin"></div><div id="who" class="small"></div>
<div id="kids"></div>
<form id="addf" hidden><div class="small">Add your child to track their fee and get reminders.</div><input name="parent" placeholder="Parent name" required><input name="child" placeholder="Student name" required><input name="whatsapp" placeholder="WhatsApp number (optional)"><button class="btn" type="submit">Add</button></form>
<div id="msg"></div></section>
</main><footer id="foot"></footer>
<script src="config.js"></script>
<script>
const C=window.FEE_CONFIG,$=id=>document.getElementById(id);
const inr=n=>"\u20B9"+Number(n).toLocaleString("en-IN");
const now=new Date();let due=new Date(now.getFullYear(),now.getMonth(),C.dueDay);
if(due<new Date(now.getFullYear(),now.getMonth(),now.getDate()))due=new Date(now.getFullYear(),now.getMonth()+1,C.dueDay);
const fmt={day:"numeric",month:"long",year:"numeric"};
$("cls").textContent=C.className;$("mon").textContent=due.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
$("amt").textContent=inr(C.monthlyFee);$("due").textContent="Due by "+due.toLocaleDateString("en-IN",fmt);
$("qr").src=C.qrImage;
$("upiBtn").href="upi://pay?pa="+encodeURIComponent(C.upiId)+"&pn="+encodeURIComponent(C.payeeName)+"&am="+C.monthlyFee+"&cu=INR&tn="+encodeURIComponent("Dance fee "+$("mon").textContent);
const rows=[["UPI ID",C.upiId],["Account name",C.bank.accountName],["Account number",C.bank.accountNumber],["IFSC",C.bank.ifsc],["Bank",C.bank.bankName+", "+C.bank.branch]];
rows.forEach(([k,v])=>{const dt=document.createElement("dt");dt.textContent=k;const dd=document.createElement("dd");const s=document.createElement("span");s.textContent=v;const b=document.createElement("button");b.textContent="Copy";b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(v);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)};dd.append(s,b);$("bank").append(dt,dd)});
$("waBtn").href="https://wa.me/"+C.whatsappNumber+"?text="+encodeURIComponent("Hi, I have paid the dance fee for "+$("mon").textContent+". Student name: ");
$("foot").textContent=C.teacherName;
let tok=sessionStorage.getItem("idt")||"";
async function api(o){const r=await fetch(C.backendUrl,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...o,idToken:tok})});return r.json()}
const LBL={N:"Not paid yet",C:"Waiting for teacher to confirm",Y:"Paid"};
function showKids(d){$("who").textContent="Signed in as "+d.email;$("gin").hidden=true;const k=$("kids");k.innerHTML="";
d.children.forEach(c=>{const el=document.createElement("div");el.className="kid";const t=document.createElement("div");t.style.fontWeight="700";t.textContent=c.child;
const m=document.createElement("div");m.className="small";m.textContent=inr(c.fee)+" per month, due by day "+c.dueDay;const b=document.createElement("span");b.className="badge b-"+c.status;b.textContent=LBL[c.status];el.append(t,m,b);
if(c.status==="N"){const i=document.createElement("input");i.placeholder="UPI reference / UTR (optional)";const x=document.createElement("button");x.className="btn";x.textContent="I have paid";x.onclick=async()=>{x.textContent="Saving...";const r=await api({action:"claim",row:c.row,reference:i.value});if(r.ok)showKids(r);else $("msg").textContent=r.error};el.append(i,x)}
k.append(el)});
$("addf").hidden=false;$("addf").onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));const r=await api({action:"addChild",...f});if(r.ok){ev.target.reset();showKids(r)}else $("msg").textContent=r.error}}
async function onCred(resp){tok=resp.credential;sessionStorage.setItem("idt",tok);$("msg").textContent="";const d=await api({action:"me"});if(d.ok)showKids(d);else{$("msg").textContent=d.error;sessionStorage.removeItem("idt");tok=""}}
if(C.backendUrl&&C.googleClientId){$("acct").hidden=false;const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=async()=>{google.accounts.id.initialize({client_id:C.googleClientId,callback:onCred});google.accounts.id.renderButton($("gin"),{theme:"outline",size:"large",text:"signin_with",width:280});
if(tok){const d=await api({action:"me"});if(d.ok)showKids(d);else{sessionStorage.removeItem("idt");tok=""}}};document.head.append(s)}
</script></body></html>
